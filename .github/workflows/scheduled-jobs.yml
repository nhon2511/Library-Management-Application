name: Scheduled jobs

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

concurrency:
  group: library-scheduled-jobs
  cancel-in-progress: false

jobs:
  run:
    if: vars.ENABLE_SCHEDULED_JOBS == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_ENV: production
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JWT_ACCESS_SECRET: scheduled-job-unused-access
      JWT_REFRESH_SECRET: scheduled-job-unused-refresh
      SMTP_HOST: smtp.resend.com
      SMTP_PORT: '2587'
      SMTP_USER: resend
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      SMTP_FROM: ${{ vars.SMTP_FROM }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run build
      - run: npm run jobs:run
